<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CampusGear</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">🎓 CampusGear</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a class="nav-link" th:href="@{/itemdetails}">Item details</a>
            <a class="nav-link active" th:href="@{/campusdetails}">Campus details</a>
            <a class="nav-link" th:href="@{/about}">Over ons</a>
            <a class="nav-link" th:href="@{/studentdetails}">Student details</a>
        </div>
    </div>
</nav>
<main class="container mt-4" th:object="${campus}">
    <h1 th:text="*{naam}"></h1>
    <table class="table table-bordered w-50">
        <tr>
            <th>Stad</th>
            <td th:text="*{city}"></td>
        </tr>
    </table>
</main>
<footer class="mt-5 py-3 bg-dark text-white text-center">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <p>© CampusGear 2025</p>
</footer>
</body>
</html>
