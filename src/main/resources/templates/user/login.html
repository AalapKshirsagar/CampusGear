<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerelement}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<main class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card mt-5">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">🔐 Inloggen</h2>

                    <div th:if="${param.error}"
                         class="alert alert-danger">
                        Fout gebruikersnaam of wachtwoord.
                    </div>

                    <div th:if="${param.logout}"
                         class="alert alert-success">
                        Je bent uitgelogd.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username"
                                   class="form-label fw-bold">
                                Gebruikersnaam
                            </label>
                            <input type="text"
                                   id="username"
                                   name="username"
                                   class="form-control"
                                   autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password"
                                   class="form-label fw-bold">
                                Wachtwoord
                            </label>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit"
                                    class="btn btn-primary">
                                Inloggen
                            </button>
                            <a th:href="@{/itemlist}"
                               class="btn btn-outline-secondary">
                                Annuleren
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
