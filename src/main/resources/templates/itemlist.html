<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerelement}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1>Beschikbare items</h1>
            <p class="text-muted"
               th:text="|${#lists.size(items)} items gevonden|"></p>
        </div>
        <div>
            <a th:href="@{/admin/itemnew}"
               class="btn btn-success me-2">
                ➕ Nieuw item
            </a>
            <button type="button" class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#filterModal">
                🔍 Filters
            </button>
        </div>
    </div>

    <!-- FILTER MODAL -->
    <div class="modal fade" id="filterModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="get" th:action="@{/itemlist}">
                    <div class="modal-header">
                        <h5 class="modal-title">🔍 Filters</h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">

                        <!-- Campus filter -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Campus</label>
                            <select name="campusId" class="form-select">
                                <option value="">Alle campussen</option>
                                <option th:each="campus : ${campussen}"
                                        th:value="${campus.id}"
                                        th:text="${campus.naam}"
                                        th:selected="${param.campusId != null
                                            and param.campusId[0] == campus.id.toString()}">
                                </option>
                            </select>
                        </div>

                        <!-- Categorie filter -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Categorie</label>
                            <select name="category" class="form-select">
                                <option value="">Alle categorieën</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat}"
                                        th:text="${cat}"
                                        th:selected="${param.category != null
                                            and param.category[0] == cat}">
                                </option>
                            </select>
                        </div>

                        <!-- Datum filter -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                📅 Beschikbaar van
                            </label>
                            <input type="date" name="startDate"
                                   class="form-control"
                                   th:value="${param.startDate != null
                                       ? param.startDate[0] : ''}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                📅 Beschikbaar tot
                            </label>
                            <input type="date" name="endDate"
                                   class="form-control"
                                   th:value="${param.endDate != null
                                       ? param.endDate[0] : ''}">
                        </div>

                    </div>
                    <div class="modal-footer">
                        <a th:href="@{/itemlist}"
                           class="btn btn-outline-secondary">
                            Reset filters
                        </a>
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Sluiten</button>
                        <button type="submit" class="btn btn-primary">
                            🔍 Zoeken
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ITEMS LIJST -->
    <div th:if="${#lists.size(items) > 0}">
        <div class="row g-4">
            <div class="col-md-4" th:each="item : ${items}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title"
                            th:text="${item.title}"></h5>
                        <p class="text-muted"
                           th:text="${item.category}"></p>
                        <p th:text="${item.campus.naam}"></p>
                        <span th:class="${item.status == 'beschikbaar'}
                              ? 'badge-beschikbaar' : 'badge-uitgeleend'"
                              th:text="${item.status}">
                        </span>
                        <div class="mt-3">
                            <a th:href="@{'/itemdetails/' + ${item.id}}"
                               class="btn btn-primary btn-sm me-2">
                                Bekijk details
                            </a>
                            <a th:href="@{'/admin/itemedit/' + ${item.id}}"
                               class="btn btn-warning btn-sm">
                                ✏️
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.size(items) == 0}">
        <div class="alert alert-info mt-4">
            <h4>😕 Geen items gevonden</h4>
            <p>Probeer andere filteropties.</p>
            <a th:href="@{/itemlist}" class="btn btn-primary">
                Reset filters
            </a>
        </div>
    </div>

</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
