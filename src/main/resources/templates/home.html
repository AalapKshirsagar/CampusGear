<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerelement}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<div class="hero">
    <div class="container">
        <h1>🎓 Welkom bij CampusGear</h1>
        <p>Leen en verhuur spullen aan medestudenten op jouw campus.</p>
        <a th:href="@{/itemlist}" class="btn btn-primary me-3">Bekijk items</a>
        <a th:href="@{/campuslist}" class="btn btn-secondary">Bekijk campussen</a>
    </div>
</div>
<main class="container">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h3>💰 Kostenbesparing</h3>
                <p class="text-muted mt-2">Leen goedkoper dan kopen</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h3>🌱 Duurzaamheid</h3>
                <p class="text-muted mt-2">Deel spullen, minder afval</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4 text-center">
                <h3>🤝 Sociale cohesie</h3>
                <p class="text-muted mt-2">Verbind studenten op campus</p>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
