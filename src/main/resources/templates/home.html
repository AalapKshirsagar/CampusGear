<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CampusGear</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">🎓 CampusGear</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/}">Home</a>
            <a class="nav-link" th:href="@{/itemdetails}">Item details</a>
            <a class="nav-link" th:href="@{/campusdetails}">Campus details</a>
            <a class="nav-link" th:href="@{/about}">Over ons</a>
        </div>
    </div>
</nav>

    <h1>Welkom bij CampusGear 🎓</h1>

    <a th:href="@{/itemdetails}" class="btn btn-primary me-2">Bekijk een item</a>
    <a th:href="@{/campusdetails}" class="btn btn-secondary">Bekijk een campus</a>
</main>
<footer class="mt-5 py-3 bg-dark text-white text-center">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <p>© CampusGear 2025</p>
