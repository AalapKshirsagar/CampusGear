<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerelement}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<main class="container mt-4">
    <div th:if="${campus != null}">
        <div class="detail-header mb-4">
            <h1 th:text="${campus.naam}"></h1>
            <p th:text="|📍 ${campus.city}|"></p>
        </div>

        <div th:if="${#lists.size(items) > 0}">
            <h3>Beschikbare items</h3>
            <div class="row g-4 mt-2">
                <div class="col-md-4" th:each="item : ${items}">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${item.title}"></h5>
                            <p class="text-muted" th:text="${item.category}"></p>
                            <p th:text="${item.description}"></p>
                            <span th:class="${item.status == 'beschikbaar'}
                                  ? 'badge-beschikbaar' : 'badge-uitgeleend'"
                                  th:text="${item.status}">
                            </span>
                            <div class="mt-3">
                                <a th:href="@{'/itemdetails/' + ${item.id}}"
                                   class="btn btn-primary btn-sm">
                                    Bekijk details
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.size(items) == 0}">
            <div class="alert alert-info mt-4">
                <h4>😕 Geen items beschikbaar</h4>
                <p>Er zijn momenteel geen items beschikbaar op deze campus.</p>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/campuslist}" class="btn btn-secondary">
                ← Terug naar campussen
            </a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
