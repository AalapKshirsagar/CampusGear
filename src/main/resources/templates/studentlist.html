<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerelement}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<main class="container mt-4">
    <h1>Alle studenten</h1>
    <div class="row g-4 mt-2">
        <div class="col-md-4" th:each="student : ${studenten}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${student.naam}"></h5>
                    <p class="text-muted" th:text="${student.campus.naam}"></p>
                    <a th:href="@{'/studentdetails/' + ${student.id}}"
                       class="btn btn-primary btn-sm mt-2">
                        Bekijk details
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
