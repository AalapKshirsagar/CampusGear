<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: headerelement}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>
<main class="container mt-4">

    <div th:if="${student != null}" th:object="${student}">
        <div class="detail-header mb-4">
            <h1 th:text="*{naam}"></h1>
            <p th:text="*{campus.naam}"></p>
        </div>

        <!-- Student info -->
        <table class="table table-bordered w-50 mt-4">
            <tr>
                <th>Email</th>
                <td th:text="*{email}"></td>
            </tr>
            <tr>
                <th>Campus</th>
                <td th:text="*{campus.naam}"></td>
            </tr>
            <tr>
                <th>Stad</th>
                <td th:text="*{campus.city}"></td>
            </tr>
        </table>

        <!-- Reservaties -->
        <div th:if="${not #lists.isEmpty(student.reservations)}" class="mt-4">
            <h3>📅 Mijn reservaties</h3>
            <div class="row g-3 mt-2">
                <div class="col-md-4"
                     th:each="reservatie : ${student.reservations}">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title"
                                th:text="${reservatie.item.title}"></h6>
                            <p class="text-muted mb-1"
                               th:text="|Van: ${#temporals.format(reservatie.startDate, 'dd MMMM yyyy')}|">
                            </p>
                            <p class="text-muted"
                               th:text="|Tot: ${#temporals.format(reservatie.endDate, 'dd MMMM yyyy')}|">
                            </p>
                            <a th:href="@{'/itemdetails/' + ${reservatie.item.id}}"
                               class="btn btn-primary btn-sm">
                                Bekijk item
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Favorieten -->
        <div th:if="${not #lists.isEmpty(student.favorieten)}" class="mt-4">
            <h3>❤️ Mijn favorieten</h3>
            <div class="row g-3 mt-2">
                <div class="col-md-4"
                     th:each="item : ${student.favorieten}">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title"
                                th:text="${item.title}"></h6>
                            <p class="text-muted"
                               th:text="${item.category}"></p>
                            <span th:class="${item.status == 'beschikbaar'}
                                  ? 'badge-beschikbaar' : 'badge-uitgeleend'"
                                  th:text="${item.status}">
                            </span>
                            <div class="mt-2">
                                <a th:href="@{'/itemdetails/' + ${item.id}}"
                                   class="btn btn-primary btn-sm">
                                    Bekijk item
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a th:href="@{/studentlist}"
               class="btn btn-outline-dark">
                ← Terug naar studenten
            </a>
        </div>
    </div>

    <div th:if="${student == null}">
        <div class="alert alert-warning mt-4">
            <h4>Geen geldige student gekozen</h4>
            <p>Ga terug naar de
                <a th:href="@{/studentlist}">studentenlijst</a>.
            </p>
        </div>
    </div>

</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
